# The robot descriptor defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF.
# Lula will only use these joints to control the robot position.
cspace:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
default_q: [
    -0.0,-1.2,1.1,0.0,0.0,0.0
]

acceleration_limits: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
jerk_limits: [10000.0, 10000.0, 10000.0, 10000.0, 10000.0, 10000.0]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted or how values in the URDF should be overwritten.

# ⚠️ 2026-09-03：這裡刻意留空，不加 CueSlideJoint 的 fixed 規則——
# CueSlideJoint 是 TableRobotManager 在 USD/PhysX articulation 層另外
# 加的（見 core/models/table_robot_manager.py），根本不存在於下面
# urdf_path 指向的 ur10e.urdf 裡，cspace_to_urdf_rules 只能引用 URDF
# 裡真的有的關節名稱（比對 Franka 官方 config 的
# panda_finger_joint1/2 fixed 規則，那兩個關節在 Franka 的 URDF 裡
# 確實存在，只是不給 RMPflow 主動控制）。RMPflow 的運動學模型只認得
# 這份 YAML／URDF 定義的 6 個手臂關節，完全不知道 CueSlideJoint 存在；
# core/services/ur10e_rmpflow_controller.py 負責在 7-DOF 完整關節陣列
# 與 RMPflow 的 6-DOF 子集合之間做名稱比對篩選/映射，CueSlideJoint
# 這個第 7 個 DOF 完全由我們自己的控制器直接讀寫，不經過 RMPflow。
cspace_to_urdf_rules:

